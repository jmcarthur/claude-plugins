            const label = n.kind === "symptom" ? n.name || "Symptom" : n.label;
            return (
              `<li class="${folded.has(n.key) ? "closed" : ""}"><div class="orow ${esc(cls)}${fresh(n)}" data-step="${esc(n.label)}">${caret}<span class="step">${swatch(n, age)}${esc(label)}</span><span class="body">${body}</span></div>` +
              (kids.length ? `<ul>${kids.map(row).join("")}</ul>` : "") +
              "</li>"
            );
          };
          const ev = tree.evidence;
          return (
            `<div class="ftools"><button data-all="open">Expand all</button><button data-all="fold">Collapse all</button></div>` +
            `<ul class="outline">${tree.roots.map(row).join("")}</ul>` +
            (ev.length
              ? `<h2>Evidence</h2><ul class="evlist">${ev.map((e) => `<li data-step="${esc(e.label)}" class="${fresh(e).trim()}"><span class="evchip">${esc(e.label)}</span><span>${inline(e.e.text)}${e.citers.length ? `<span class="by"> · cited by ${e.citers.map((m) => esc(m.label)).join(", ")}</span>` : '<span class="by"> · not cited</span>'}</span></li>`).join("")}</ul>`
              : "")
          );
        }
        // Matrix: a row per step in step order, a column per evidence item in the
        // order the steps first cite them, a dot where a step cites the item.
        function matrixHTML() {
          const rows = [...tree.byLabel.values()].filter(
            (n) => n.kind === "cause",
          );
          const cols = [];
          for (const n of rows)
            for (const e of n.cites) if (!cols.includes(e)) cols.push(e);
          for (const e of tree.evidence) if (!cols.includes(e)) cols.push(e);
          if (!rows.length) return '<p class="empty">No causes yet.</p>';
          const depth = (n) => n.label.split(".").length - 1;
          return (
            `<table class="matrix"><thead><tr><th class="row"></th>${cols.map((e, j) => `<th class="ev" data-col="${j}" data-step="${esc(e.label)}" title="${esc(e.label)} ${esc(e.e.text)}"><span>${esc(e.label)}</span></th>`).join("")}</tr></thead><tbody>` +
            rows
              .map(
                (n) =>
                  `<tr class="${esc(n.c.status)}"><th class="row" data-step="${esc(n.label)}" title="${esc(n.label)} ${esc(n.c.cause)}"><div style="padding-left:${depth(n) * 14}px"><span class="step">${esc(n.label)}</span>${esc(n.c.cause)}</div></th>${cols.map((e, j) => `<td data-col="${j}" class="${n.cites.includes(e) ? "on" : ""}"${n.cites.includes(e) ? ` data-step="${esc(e.label)}" title="${esc(n.label)} cites ${esc(e.label)}"` : ""}></td>`).join("")}</tr>`,
              )
              .join("") +
            `</tbody><tfoot><tr><th>cited by</th>${cols.map((e) => `<td>${e.citers.length}</td>`).join("")}</tr></tfoot></table>`
          );
        }
        function wireFlat(box) {
          box.onclick = (e) => {
            const f = e.target.closest("[data-fold]");
            if (f) {
              const li = f.closest("li");
              li.classList.toggle("closed");
              f.textContent = li.classList.contains("closed") ? "▸" : "▾";
              if (li.classList.contains("closed")) folded.add(f.dataset.fold);
              else folded.delete(f.dataset.fold);
              return;
            }
            const all = e.target.closest("[data-all]");
            if (all) {
              for (const c of box.querySelectorAll("[data-fold]")) {
                const li = c.closest("li"),
                  shut =
                    all.dataset.all === "fold" && !c.classList.contains("leaf");
                li.classList.toggle("closed", shut);
                c.textContent = shut ? "▸" : "▾";
                if (shut) folded.add(c.dataset.fold);
                else folded.delete(c.dataset.fold);
              }
              return;
            }
            const s = e.target.closest("[data-step]");
            if (s && !e.target.closest("a:not(.jump)")) {
              e.preventDefault();
              open(s.dataset.step);
            }
          };
          // Matrix: the hovered column lights up, as the row does by CSS.
          box.onmouseover = (e) => {
            const c = e.target.closest("[data-col]");
            for (const h of box.querySelectorAll(".hot"))
              h.classList.remove("hot");
            if (c)
              for (const h of box.querySelectorAll(
                `[data-col="${c.dataset.col}"]`,
              ))
                h.classList.add("hot");
          };
        }
        // The supported causes on a step's path from its symptom, itself included:
        // the unproven links that a cause, and a fix there, rest on.
        const unproven = (n) => {
          const out = [];
          for (let m = n; m && m.kind === "cause"; m = m.parent)
            if (m.c.status === "supported") out.unshift(m.label);
          return out;
        };
        const linksText = (links) =>
          `${links.length} unproven link${links.length === 1 ? "" : "s"}: ${links.join(", ")}`;
        const isFix = (c) =>
          c.status !== "refuted" &&
          (c.reach === "fix" ||
            (c.reach === "design" && c.verdict === "change"));
        function fixesPanel(step) {
          const fixes = [...tree.byLabel.values()].filter(
            (n) => n.kind === "cause" && isFix(n.c),
          );
          return fixes.length
            ? `<h3>Fixes</h3><ul>${fixes
                .map((n) => {
                  const links = unproven(n);
                  return `<li>${step(n.label)} ${inline(n.c.cause)}${links.length ? `<br><span class="chip unproven">rests on ${esc(linksText(links))}</span>` : ""}</li>`;
                })
                .join("")}</ul>`
            : "";
        }

        function report(a) {
          const box = $("#report");
          const step = (s) =>
            `<span class="steplink" data-step="${esc(s)}">${esc(s)}</span>`;
          if (a.status === "concluded") {
            box.hidden = false;
            box.innerHTML =
              `<h2>Conclusion <span>▾</span></h2>` +
              fixesPanel(step) +
              (tree.roots.length > 1
                ? `<h3>Symptoms</h3><ul>${tree.roots.map((r) => `<li>${step(r.label)} ${inline(r.text)}</li>`).join("")}</ul>`
                : "") +
              `<h3>Left alone</h3>${(a.leftAlone ?? []).length ? `<ul>${a.leftAlone.map((u) => `<li>${step(u.step)} ${inline(u.reason)}</li>`).join("")}</ul>` : '<p class="note">Nothing: every branch end was fixed.</p>'}` +
              `<h3>How it could have been avoided</h3>${(a.avoidable ?? []).length ? `<ul>${a.avoidable.map((v) => `<li>${inline(v.avoidable)}<br><b>Change:</b> ${inline(v.avoid)}<br><span class="chip ${v.worth === "yes" ? "checked" : ""}">worth it: ${esc(v.worth)}</span> ${inline(v.why)}</li>`).join("")}</ul>` : '<p class="note">Nothing found.</p>'}`;
          } else if (a.status === "abandoned") {
            box.hidden = false;
            box.innerHTML = `<h2>Abandoned <span>▾</span></h2>${prose(a.reason)}`;
          } else box.hidden = true;
          $("h2", box)?.addEventListener("click", () =>
            box.classList.toggle("closed"),
          );
          for (const s of box.querySelectorAll(".steplink"))
            s.onclick = () => open(s.dataset.step);
        }

        function open(label, refresh = false) {
          const n = tree.find(label);
          if (!n) return;
          openLabel = label;
          openKey = n.key;
          history.replaceState(null, "", `#${label}`);
          const doc = $("#doc"),
            overlay = $("#overlay"),
            scroll = overlay.scrollTop;
          doc.innerHTML =
            n.kind === "symptom"
              ? symptomDoc(data, n)
              : n.kind === "same"
                ? sameDoc(n)
                : n.kind === "evidence"
                  ? evidenceDoc(n)
                  : causeDoc(data, n);
          overlay.hidden = false;
          overlay.scrollTop = refresh ? scroll : 0;
          $(".close", doc).onclick = close;
          for (const j of doc.querySelectorAll("a.jump"))
            j.onclick = (e) => {
              e.preventDefault();
              open(j.dataset.step);
            };
        }
        function close() {
          $("#overlay").hidden = true;
          openLabel = openKey = null;
          history.replaceState(null, "", location.pathname + location.search);
        }
        $("#overlay").addEventListener("click", (e) => {
          if (e.target.id === "overlay") close();
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !$("#overlay").hidden) close();
        });

        const jump = (label, text) =>
          `<a class="jump" href="#" data-step="${esc(label)}">${esc(label)}</a>${text ? ` ${inline(text)}` : ""}`;
        const section = (title, body) =>
          body ? `<section><h3>${title}</h3>${body}</section>` : "";
        const childrenOf = (n) => {
          if (!n.group) return "";
          const list = n.children
            .map(
              (c) =>
                `<li>${jump(c.label, c.kind === "same" ? `the same cause as step ${c.c.same}` : c.c.cause)}${c.kind !== "same" && c.c.status === "refuted" ? ' <span class="chip refuted">ruled out</span>' : ""}</li>`,
            )
            .join("");
          const live = n.group.causes.filter(counted).length;
          return `<p>${live > 1 || n.group.combine === "parts" ? `<b>${COMBINE[n.group.combine]}.</b>` : "One cause."}${n.group.coverage ? ` ${inline(n.group.coverage)}` : ""}</p><ul>${list}</ul>`;
        };
        const under = (p) =>
          p.kind === "symptom"
            ? p.name
              ? `symptom ${p.name}`
              : "the symptom"
            : `step ${p.label}`;
        const rootOf = (n) => {
          while (n.parent) n = n.parent;
          return n;
        };
        const closeBtn =
          '<button class="close" title="Close (Esc)" aria-label="Close">×</button>';

        function causeDoc(a, n) {
          const c = n.c;
          const named = [...tree.byLabel.values()].filter(
            (m) => m.kind === "same" && m.c.same === n.label,
          );
          const left = (a.leftAlone ?? []).find((u) => u.step === n.label);
          const color = viridis(
            ageRank(
              [...tree.byLabel.values()].filter((m) => m.kind !== "symptom"),
            )(n),
          );
          const links = unproven(n);
          const effects =
            c.effects === undefined
              ? ""
              : c.effects.length
                ? `<ul>${c.effects.map((e) => `<li>${inline(e)}</li>`).join("")}</ul>`
                : "<p>None found.</p>";
          return (
            closeBtn +
            `<div class="kick"><span class="swatch" style="background:${rgb(color)}"></span><span class="step">Step ${esc(n.label)}</span><span class="chip ${esc(c.status)}">${esc(c.status === "refuted" ? "ruled out" : c.status)}</span>${c.reach ? `<span class="chip">${esc(c.reach)}</span>` : ""}</div>` +
            `<h2 class="${c.status === "refuted" ? "struck" : ""}">${inline(c.cause)}</h2>` +
            section(
              "Evidence",
              prose(c.evidence) +
                ((n.cites ?? []).length
                  ? `<ul>${n.cites
                      .map(
                        (e) =>
                          `<li>${jump(e.label, e.e.text)}${
                            e.citers.length > 1
                              ? ` <span class="note">(also cited by ${e.citers
                                  .filter((m) => m !== n)
                                  .map((m) => esc(m.label))
                                  .join(", ")})</span>`
                              : ""
                          }</li>`,
                      )
                      .join("")}</ul>`
                  : ""),
            ) +
            section("Status", `<p>${STATUS[c.status] ?? esc(c.status)}</p>`) +
            section("The check that would prove it", prose(c.proof)) +
            section("Why that check cannot be run", prose(c.unprovable)) +
            section(
              isFix(c)
                ? "This fix rests on unproven links"
                : "Unproven links on its path",
              links.length && c.status !== "refuted"
                ? `<p>${links.length} unproven link${links.length === 1 ? "" : "s"}: ${links.map((l) => jump(l)).join(", ")}</p>`
                : "",
            ) +
            section("What else it affects", effects) +
            section(
              "Reach",
              c.reach ? `<p>${esc(REACH[c.reach] ?? c.reach)}</p>` : "",
            ) +
            section("Purpose of the design", prose(c.purpose)) +
            section(
              "Verdict on the design",
              c.verdict
                ? `<p>${c.verdict === "keep" ? "Keep it." : "Change it."}</p>`
                : "",
            ) +
            section("Why it is kept", prose(c.keepReason)) +
            section("The change", prose(c.change)) +
            section(
              "The fix",
              c.fix ? `<p>${esc(FIX[c.fix] ?? c.fix)}</p>` : "",
            ) +
            section("Why the fix is in proportion", prose(c.proportion)) +
            section("Why it only hides the cause", prose(c.hideReason)) +
            (c.weight || c.share || c.need
              ? `<div class="two">${section("Weight", prose(c.weight))}${section("Share of the whole", prose(c.share))}${section("What it would be if right", prose(c.need))}</div>`
              : "") +
            section("Its causes", childrenOf(n)) +
            section(
              "Also named by",
              named.length
                ? `<ul>${named.map((m) => `<li>${jump(m.label, `under ${under(m.parent)}`)}</li>`).join("")}</ul>`
                : "",
            ) +
            section("Left alone", left ? prose(left.reason) : "") +
            `<div class="times">Added ${esc(when(c.added))} (${esc(ago(c.added))})${c.revised && c.revised !== c.added ? ` · last revised ${esc(when(c.revised))} (${esc(ago(c.revised))})` : ""}${c.estimated ? ' · <span class="note">times estimated from the log; this record has no recorded times</span>' : ""}</div>`
          );
        }

        function evidenceDoc(n) {
          return (
            closeBtn +
            `<div class="kick"><span class="step">Evidence ${esc(n.label)}</span></div>` +
            section("What it shows", prose(n.e.text)) +
            section(
              "Cited by",
              n.citers.length
                ? `<ul>${n.citers.map((m) => `<li>${jump(m.label, m.c.cause)} <span class="chip ${esc(m.c.status)}">${esc(m.c.status)}</span></li>`).join("")}</ul>`
                : '<p class="note">No cause cites it.</p>',
            ) +
            (n.e.added
              ? `<div class="times">Added ${esc(when(n.e.added))} (${esc(ago(n.e.added))})</div>`
              : "")
          );
        }

        function sameDoc(n) {
          const target = tree.byLabel.get(n.c.same);
          return (
            closeBtn +
            `<div class="kick"><span class="step">Step ${esc(n.label)}</span></div><h2>The same cause as step ${jump(n.c.same)}</h2>` +
            section(
              "That step",
              target && target.c ? `<p>${inline(target.c.cause)}</p>` : "",
            ) +
            section(
              "Named under",
              `<p>${n.parent.kind === "symptom" ? jump(n.parent.label, under(n.parent)) : jump(n.parent.label, n.parent.c.cause)}</p>`,
            ) +
            `<p class="note">It is not walked again here, and counts as step ${esc(n.c.same)} when the fixes are checked against ${under(n.parent.kind === "symptom" ? n.parent : rootOf(n))}.</p>` +
            `<div class="times">Added ${esc(when(n.c.added))} (${esc(ago(n.c.added))})</div>`
          );
        }

        // With several symptoms, each one's document lists the others, and the
        // branch ends left alone under it; how it could have been avoided is shared.
        function symptomDoc(a, n) {
          const others = tree.roots.filter((r) => r !== n);
          const mine = (a.leftAlone ?? []).filter(
            (u) =>
              !n.name ||
              (n === tree.roots[0]
                ? !/^S/.test(u.step)
                : u.step.startsWith(`${n.name}.`)),
          );
          return (
            closeBtn +
            `<div class="kick"><span class="step">Symptom${n.name ? ` ${esc(n.name)}` : ""}</span>${statusChip(a.status)}</div><h2>${inline(n.text)}</h2>` +
            section(
              "Why",
              n.group
                ? childrenOf(n)
                : '<p class="note">No causes recorded yet.</p>',
            ) +
            section(
              "Left alone",
              mine.length
                ? `<ul>${mine.map((u) => `<li>${jump(u.step, u.reason)}</li>`).join("")}</ul>`
                : "",
            ) +
            section(
              "The other symptoms",
              others.length
                ? `<ul>${others.map((r) => `<li>${jump(r.label, r.text)}</li>`).join("")}</ul>`
                : "",
            ) +
            section(
              "How it could have been avoided",
              (a.avoidable ?? []).length
                ? `<ul>${a.avoidable.map((v) => `<li>${inline(v.avoidable)} <b>Change:</b> ${inline(v.avoid)} <b>Worth it:</b> ${esc(v.worth)}. ${inline(v.why)}</li>`).join("")}</ul>`
                : "",
            ) +
            section("Why it was abandoned", prose(a.reason)) +
            `<div class="times">Analysis <code>${esc(a.id)}</code> · started ${esc(when(a.started))}${a.closed ? ` · closed ${esc(when(a.closed))}` : ""}${a.session ? ` · session <code>${esc(a.session)}</code>` : ""}</div>`
          );
        }

        await draw();
        listeners.push((changed) => {
          if (changed.includes(`${id}.json`)) draw();
        });
        matchMedia("(prefers-color-scheme: dark)").addEventListener(
          "change",
          draw,
        );
      }

      // ---------- routing ----------

      const parts = location.pathname
        .split("/")
        .filter(Boolean)
        .map(decodeURIComponent);
      connect();
      if (parts[0] === "s" && parts[1]) sessionView(parts[1]);
      else if (parts[0] === "a" && parts[1]) analysisView(parts[1]);
      else sessionsView();
    </script>
  </body>
</html>
